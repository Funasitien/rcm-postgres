buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.0.0-beta4'
    }
}

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'com.gradleup.shadow'

group = 'group.aelysium'
version = module_version

repositories {
    mavenCentral()
    maven { url = "https://java.funa.dev/snapshots/" }
    maven { url = "https://java.funa.dev/releases/" }
}

dependencies {
    compileOnly 'group.aelysium.rustyconnector:core:' + rustyconnector_version

    shadow 'org.postgresql:postgresql:42.7.2'
    shadow 'com.zaxxer:HikariCP:5.0.0'
    compileOnly 'net.kyori:adventure-api:4.17.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withJavadocJar()
    withSourcesJar()
}

compileJava {
    options.encoding = "UTF-8"
}

javadoc {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName.set(archives_base_name)
    archiveClassifier.set('')
    mergeServiceFiles()

    relocate "org.postgresql", "group.aelysium.rustyconnector.modules.postgres.shaded.org.postgresql"
    relocate "com.zaxxer", "group.aelysium.rustyconnector.modules.postgres.shaded.com.zaxxer"

    configurations = [project.configurations.shadow]
}

tasks.named('jar').configure {
    enabled = false
}
tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xdoclint:none']
}
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}
tasks.build {
    dependsOn shadowJar
}


jar.finalizedBy(shadowJar)
